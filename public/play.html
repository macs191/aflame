<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة عرض الميديا والبث المباشر</title>
    
    <!-- CSS / Fonts / Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HLS.js Support for .m3u8 IPTV & Live Streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --accent-color: #e50914;
            --accent-hover: #b80710;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        /* Top Navbar */
        .navbar {
            background-color: #000;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #181818;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 5px 15px;
            width: 100%;
            max-width: 350px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            padding: 5px;
            font-family: inherit;
        }

        .container {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-color);
            padding-right: 12px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .item-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.25);
            border-color: var(--accent-color);
        }

        .thumb-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
        }

        .thumb-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .item-card:hover .play-overlay {
            opacity: 1;
        }

        .play-overlay i {
            font-size: 3.2rem;
            color: var(--accent-color);
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
        }

        .category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .card-details {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .card-title {
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Modal Overlay Window */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 1000px;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            border: 1px solid var(--border-color);
            animation: fadeInScale 0.25s ease-out;
            margin: auto;
        }

        @keyframes fadeInScale {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: var(--accent-color);
            transform: rotate(90deg);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
        }

        .player-wrapper video,
        .player-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            outline: none;
        }

        .modal-info {
            padding: 20px;
        }

        .modal-title-text {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-stats {
            display: flex;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        /* Server Select Section */
        .servers-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .servers-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .servers-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .server-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .server-btn:hover, .server-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .description-box {
            background: #141414;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #ccc;
            white-space: pre-line;
            max-height: 120px;
            overflow-y: auto;
        }

        /* Loading & Error Indicators */
        .status-box {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
            color: var(--text-secondary);
        }

        .spinner {
            width: 42px; height: 42px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .navbar { padding: 12px 15px; }
            .search-box { max-width: 180px; }
            .container { padding: 0 12px; }
            .modal { padding: 0; }
            .modal-content { border-radius: 0; min-height: 100vh; }
            .modal-info { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar">
        <a href="#" class="navbar-brand">
            <i class="fa-solid fa-circle-play"></i> منصة العرض
        </a>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color: #777;"></i>
            <input type="text" id="searchInput" placeholder="بحث عن فيديو أو قناة..." onkeyup="filterItems()">
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="section-header">
            <h2 class="section-title"><i class="fa-solid fa-tv"></i> القنوات والفيديوهات المتاحة</h2>
        </div>

        <div id="itemsGrid" class="items-grid">
            <div class="status-box">
                <div class="spinner"></div>
                <p>جاري تحميل المحتوى من قاعدة البيانات...</p>
            </div>
        </div>
    </div>

    <!-- Modal Player Window -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()" title="إغلاق"><i class="fa-solid fa-xmark"></i></button>
            
            <div id="playerContainer" class="player-wrapper">
                <!-- المشغل يعالج ويحقن هنا -->
            </div>

            <div class="modal-info">
                <h2 id="modalTitle" class="modal-title-text">عنوان العنصر</h2>
                
                <div class="modal-stats">
                    <span><i class="fa-regular fa-eye"></i> <span id="modalViews">0</span> مشاهدة</span>
                    <span><i class="fa-solid fa-tag"></i> <span id="modalCategory">عام</span></span>
                </div>

                <!-- قسم السيرفرات المتعددة -->
                <div id="serversSection" class="servers-section" style="display: none;">
                    <div class="servers-title"><i class="fa-solid fa-server"></i> اختر سيرفر المشاهدة:</div>
                    <div id="serversGrid" class="servers-grid"></div>
                </div>

                <div class="description-box" id="modalDesc">
                    لا يوجد وصف متوفر لهذا المحتوى.
                </div>
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // 1. إعدادات وتكوين Firebase
        // =========================================================
        const firebaseConfig = {
  apiKey: "AIzaSyC9cmh_bzA4ZeV8bYlbqaGrmIri2PUGx2A",
  authDomain: "voip17.firebaseapp.com",
  databaseURL: "https://voip17-default-rtdb.firebaseio.com",
  projectId: "voip17",
  storageBucket: "voip17.firebasestorage.app",
  messagingSenderId: "608379006778",
  appId: "1:608379006778:web:51fe8032d09fbd5b556a03",
  measurementId: "G-GZNJZLM701"
};

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allFetchedItems = [];

        // =========================================================
        // 2. قراءة واستجابة البيانات عند فتح الصفحة
        // =========================================================
        window.addEventListener('DOMContentLoaded', () => {
            fetchMediaData();
        });

        function fetchMediaData() {
            const grid = document.getElementById('itemsGrid');

            db.ref('videos').on('value', (snapshot) => {
                grid.innerHTML = '';
                allFetchedItems = [];

                if (!snapshot.exists()) {
                    grid.innerHTML = '<div class="status-box"><p>لا يوجد محتوى مضاف حالياً في قاعدة البيانات.</p></div>';
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const data = childSnapshot.val();
                    allFetchedItems.push({ id, ...data });
                });

                renderGridItems(allFetchedItems);
            }, (error) => {
                console.error(error);
                grid.innerHTML = '<div class="status-box"><p>حدث خطأ أثناء الاتصال بقاعدة البيانات.</p></div>';
            });
        }

        // =========================================================
        // 3. عرض العريشة (Grid Render)
        // =========================================================
        function renderGridItems(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<div class="status-box"><p>لا تتوفر نتائج تطابق بحثك.</p></div>';
                return;
            }

            items.forEach((item) => {
                const thumb = item.thumbnailUrl || 'https://via.placeholder.com/320x180/1f1f1f/ffffff?text=FARESPCB';
                const title = item.title || 'بدون عنوان';
                const category = item.category || item.type || 'فيديو';
                const views = item.views || 0;

                const cardHTML = `
                    <div class="item-card" onclick="openPlayerModal('${item.id}')">
                        <div class="thumb-container">
                            <img src="${thumb}" alt="${title}" loading="lazy">
                            <span class="category-badge">${category}</span>
                            <div class="play-overlay">
                                <i class="fa-solid fa-circle-play"></i>
                            </div>
                        </div>
                        <div class="card-details">
                            <div class="card-title">${title}</div>
                            <div class="card-meta">
                                <span><i class="fa-regular fa-eye"></i> ${views} مشاهدة</span>
                                <span><i class="fa-solid fa-play"></i> تشغيل</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // =========================================================
        // 4. فتح المشغل وقراءة السيرفرات والروابط
        // =========================================================
        function openPlayerModal(id) {
            const item = allFetchedItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modalTitle').innerText = item.title || 'بدون عنوان';
            document.getElementById('modalDesc').innerText = item.description || 'لا يوجد وصف متوفر.';
            document.getElementById('modalViews').innerText = (item.views || 0) + 1;
            document.getElementById('modalCategory').innerText = item.category || item.type || 'عام';

            const serversSection = document.getElementById('serversSection');
            const serversGrid = document.getElementById('serversGrid');
            serversGrid.innerHTML = '';

            // فحص السيرفرات والروابط
            if (item.servers && Array.isArray(item.servers) && item.servers.length > 0) {
                serversSection.style.display = 'block';

                item.servers.forEach((srv, index) => {
                    const btn = document.createElement('button');
                    btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
                    btn.innerHTML = `<i class="fa-solid fa-play"></i> ${srv.name || 'سيرفر ' + (index + 1)}`;
                    
                    btn.onclick = () => {
                        document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        playSource(srv.url);
                    };
                    serversGrid.appendChild(btn);
                });

                // تشغيل السيرفر الأول فوراً
                playSource(item.servers[0].url);

            } else if (item.videoUrl || item.url) {
                serversSection.style.display = 'none';
                playSource(item.videoUrl || item.url);
            } else {
                alert('عذراً، لا يوجد رابط تشغيل متاح لهذا العنصر.');
                return;
            }

            // إظهار النافذة
            document.getElementById('playerModal').classList.add('active');

            // زيادة المشاهدات بـ Firebase
            db.ref('videos/' + id + '/views').set((item.views || 0) + 1);
        }

        // =========================================================
        // 5. محرك تشغيل جميع صيغ الفيديوهات والبث
        // =========================================================
        function playSource(url) {
            const container = document.getElementById('playerContainer');
            container.innerHTML = '';

            if (!url) return;

            // أ) روابط يوتيوب (YouTube)
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                const embedUrl = convertYouTubeUrl(url);
                container.innerHTML = `<iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                return;
            }

            // ب) روابط Google Drive
            if (url.includes('drive.google.com')) {
                const embedUrl = url.replace('/view', '/preview');
                container.innerHTML = `<iframe src="${embedUrl}" allow="autoplay" allowfullscreen></iframe>`;
                return;
            }

            // ج) روابط بث IPTV و HLS (.m3u8)
            if (url.includes('.m3u8')) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.style.width = '100%';
                video.style.height = '100%';
                container.appendChild(video);

                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                }
                return;
            }

            // د) روابط الميديا المباشرة (MP4, MKV, WebM, OGG...)
            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.style.width = '100%';
            video.style.height = '100%';

            const source = document.createElement('source');
            source.src = url;
            video.appendChild(source);
            container.appendChild(video);
        }

        // =========================================================
        // 6. إغلاق المشغل وإنهاء الفيديو نهائياً
        // =========================================================
        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const container = document.getElementById('playerContainer');
            
            modal.classList.remove('active');
            container.innerHTML = ''; // تفريغ المشغل لإيقاف الصوت والميديا تماماً
        }

        // إغلاق الشاشة بضغط الخروج أو الضغط الخارجي
        window.onclick = function(e) {
            const modal = document.getElementById('playerModal');
            if (e.target === modal) {
                closePlayer();
            }
        };

        // =========================================================
        // 7. أدوات مساعدة (Helpers)
        // =========================================================
        function convertYouTubeUrl(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1` : url;
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allFetchedItems.filter(item => {
                const title = (item.title || '').toLowerCase();
                const desc = (item.description || '').toLowerCase();
                return title.includes(query) || desc.includes(query);
            });
            renderGridItems(filtered);
        }
    </script>
</body>
</html>
