<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفيديوهات</title>
    
    <!-- CSS / Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HLS.js Support for .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Firebase SDKs (v9/v10 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --accent-color: #ff0000;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* Navbar */
        .navbar {
            background-color: #000;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Layout Container */
        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
        }

        /* Main Content Section */
        .main-content {
            width: 100%;
        }

        /* Player Container */
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .player-wrapper video,
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        /* Video Info */
        .video-details {
            margin-top: 15px;
        }

        .video-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        .video-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .channel-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .channel-name {
            font-weight: 700;
            font-size: 1rem;
        }

        .stats-badge {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            gap: 15px;
        }

        /* Description Box */
        .description-box {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-size: 0.95rem;
            white-space: pre-line;
            word-break: break-word;
        }

        /* Sidebar - Suggested Videos */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .suggested-item {
            display: flex;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .suggested-item:hover {
            background: #2a2a2a;
        }

        .suggested-thumb {
            width: 120px;
            height: 70px;
            border-radius: 6px;
            background-color: #333;
            object-fit: cover;
            flex-shrink: 0;
        }

        .suggested-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .suggested-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .suggested-views {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Loading & Status States */
        .status-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            text-align: center;
            gap: 15px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
            .player-wrapper {
                border-radius: 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 0;
            }
            .video-details, .description-box, .sidebar {
                padding: 0 12px;
            }
            .suggested-thumb {
                width: 100px;
                height: 60px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="navbar-brand">
            <i class="fa-solid fa-play-circle"></i> منصة الفيديو
        </a>
    </nav>

    <div class="container">
        <!-- قسم المشغل والبيانات الأساسية -->
        <main class="main-content">
            <div id="playerContainer" class="player-wrapper">
                <div class="status-container">
                    <div class="spinner"></div>
                    <p>جاري تحميل المشغل والبيانات...</p>
                </div>
            </div>

            <div class="video-details" id="videoDetails" style="display: none;">
                <h1 class="video-title" id="vTitle">عنوان الفيديو</h1>
                
                <div class="video-meta">
                    <div class="channel-info">
                        <div class="channel-avatar" id="vAvatar">U</div>
                        <div>
                            <div class="channel-name" id="vUploader">اسم الناشر</div>
                        </div>
                    </div>
                    
                    <div class="stats-badge">
                        <span><i class="fa-regular fa-eye"></i> <span id="vViews">0</span> مشاهدة</span>
                        <span><i class="fa-regular fa-calendar"></i> <span id="vDate">--/--/----</span></span>
                    </div>
                </div>

                <div class="description-box" id="vDescription">
                    لا يوجد وصف متوفر لهذا الفيديو.
                </div>
            </div>
        </main>

        <!-- قسم الفيديوهات المقترحة -->
        <aside class="sidebar">
            <h3 class="sidebar-title">فيديوهات قد تعجبك</h3>
            <div id="suggestedList">
                <div class="status-container" style="min-height: 150px;">
                    <div class="spinner" style="width: 25px; height: 25px;"></div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // =========================================================
        // 1. إعدادات Firebase - قم بوضع بيانات مشروعك هنا
        // =========================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // =========================================================
        // 2. الحصول على ID الفيديو من رابط الصفحة (?id=VIDEO_ID)
        // =========================================================
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');

        // =========================================================
        // 3. التحقق والتحميل عند فتح الصفحة
        // =========================================================
        window.addEventListener('DOMContentLoaded', () => {
            if (!videoId) {
                showError("لم يتم العثور على معرّف الفيديو (ID) في رابط الصفحة.");
                return;
            }
            loadVideoData(videoId);
            loadSuggestedVideos(videoId);
        });

        // =========================================================
        // 4. قراءة بيانات الفيديو من Realtime Database
        // =========================================================
        function loadVideoData(id) {
            const videoRef = db.ref('videos/' + id);

            videoRef.once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    showError("عذراً، هذا الفيديو غير موجود أو تم حذفه.");
                    return;
                }

                const data = snapshot.val();
                
                // تحديث بيانات النص بالصفحة
                document.getElementById('vTitle').innerText = data.title || 'بدون عنوان';
                document.getElementById('vDescription').innerText = data.description || 'لا يوجد وصف متوفر.';
                document.getElementById('vUploader').innerText = data.uploader || 'مجهول';
                document.getElementById('vAvatar').innerText = (data.uploader || 'U').charAt(0).toUpperCase();
                document.getElementById('vViews').innerText = (data.views || 0) + 1; // إظهار الزيادة فوراً
                document.getElementById('vDate').innerText = data.createdAt ? formatDate(data.createdAt) : 'غير محدد';

                // إظهار قسم التفاصيل
                document.getElementById('videoDetails').style.display = 'block';

                // تشغيل الفيديو بناءً على الرابط والصيغة
                setupPlayer(data.videoUrl);

                // زيادة عداد المشاهدات في قاعدة البيانات
                incrementViews(id, data.views || 0);

            }).catch((error) => {
                console.error(error);
                showError("حدث خطأ أثناء الاتصال بقاعدة البيانات.");
            });
        }

        // =========================================================
        // 5. محرك تشغيل الفيديو لدعم كافة الصيغ والمصادر
        // =========================================================
        function setupPlayer(url) {
            const container = document.getElementById('playerContainer');
            container.innerHTML = ''; // تفريغ شاشة التحميل

            if (!url) {
                showError("رابط الفيديو غير صالح أو غير متوفر.");
                return;
            }

            // أ) معالجة روابط يوتيوب (YouTube)
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                const ytEmbedUrl = convertToYouTubeEmbed(url);
                container.innerHTML = `<iframe src="${ytEmbedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                return;
            }

            // ب) معالجة روابط Google Drive
            if (url.includes('drive.google.com')) {
                const driveEmbedUrl = url.replace('/view', '/preview');
                container.innerHTML = `<iframe src="${driveEmbedUrl}" allow="autoplay"></iframe>`;
                return;
            }

            // ج) معالجة بث HLS (.m3u8)
            if (url.includes('.m3u8')) {
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.style.width = '100%';
                video.style.height = '100%';
                container.appendChild(video);

                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // دعم متصفح Safari على iOS/Mac
                    video.src = url;
                }
                return;
            }

            // د) معالجة روابط الفيديو المباشرة (MP4, WebM, OGG, MKV)
            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            video.playsInline = true;
            video.style.width = '100%';
            video.style.height = '100%';

            const source = document.createElement('source');
            source.src = url;
            video.appendChild(source);

            // رسالة خطأ في حال عدم قدرة المتصفح على التشغيل
            video.onerror = () => {
                showError("تعذر تشغيل الفيديو. صيغة الفيديو قد تكون غير مدعومة مباشرة في متصفحك.");
            };

            container.appendChild(video);
        }

        // =========================================================
        // 6. جلب قائمة الفيديوهات المقترحة
        // =========================================================
        function loadSuggestedVideos(currentId) {
            const suggestedContainer = document.getElementById('suggestedList');
            
            db.ref('videos').limitToLast(10).once('value').then((snapshot) => {
                suggestedContainer.innerHTML = '';

                if (!snapshot.exists()) {
                    suggestedContainer.innerHTML = '<p style="color: var(--text-secondary);">لا توجد فيديوهات أخرى.</p>';
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const key = childSnapshot.key;
                    const data = childSnapshot.val();

                    // استبعاد الفيديو الحالي من القائمة
                    if (key !== currentId) {
                        const thumb = data.thumbnailUrl || 'https://via.placeholder.com/120x70/1f1f1f/ffffff?text=Video';
                        const itemHTML = `
                            <a href="?id=${key}" class="suggested-item">
                                <img src="${thumb}" class="suggested-thumb" alt="thumbnail">
                                <div class="suggested-info">
                                    <div class="suggested-title">${data.title || 'بدون عنوان'}</div>
                                    <div class="suggested-views">${data.views || 0} مشاهدة</div>
                                </div>
                            </a>
                        `;
                        suggestedContainer.innerHTML += itemHTML;
                    }
                });

                if (suggestedContainer.innerHTML.trim() === '') {
                    suggestedContainer.innerHTML = '<p style="color: var(--text-secondary);">لا توجد فيديوهات مقترحة حالياً.</p>';
                }
            });
        }

        // =========================================================
        // 7. وظائف مساعدة (Helpers)
        // =========================================================

        // زيادة المشاهدات
        function incrementViews(id, currentViews) {
            db.ref('videos/' + id + '/views').set(currentViews + 1);
        }

        // تحويل روابط يوتيوب إلى Embed
        function convertToYouTubeEmbed(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length == 11) ? "https://www.youtube.com/embed/" + match[2] + "?autoplay=1" : url;
        }

        // تنسيق التاريخ
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('ar-EG');
        }

        // عرض الأخطاء داخل المشغل
        function showError(msg) {
            const container = document.getElementById('playerContainer');
            container.innerHTML = `
                <div class="status-container">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; color: var(--accent-color);"></i>
                    <p style="padding: 0 15px;">${msg}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
