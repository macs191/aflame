<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Vercel & Firebase</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; color: #38bdf8; text-align: center; }
        
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #334155; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }
        input[type="text"] {
            width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155;
            border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none;
        }
        input:focus { border-color: #38bdf8; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #0369a1; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { background: #0f172a; color: #94a3b8; }
        td a { color: #38bdf8; text-decoration: none; }
        .url-cell { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة تحكم الفيديوهات (Vercel)</h1>

    <!-- نموذج إضافة فيديو -->
    <div class="card">
        <h2>إضافة فيديو جديد</h2>
        <form id="addForm" style="margin-top: 15px;">
            <div class="form-group">
                <label>عنوان الفيديو / الحلقة:</label>
                <input type="text" id="title" placeholder="مثال: مسلسل X - الحلقة 1" required>
            </div>
            <div class="form-group">
                <label>رابط البث (m3u8):</label>
                <input type="text" id="streamUrl" placeholder="https://domain.com/hls/.../master.m3u8" required>
            </div>
            <button type="submit" class="btn">حفظ وإضافة الفيديو</button>
        </form>
    </div>

    <!-- جدول الفيديوهات -->
    <div class="card">
        <h2>الفيديوهات المضافة</h2>
        <table>
            <thead>
                <tr>
                    <th>العنوان</th>
                    <th>VID</th>
                    <th>الرابط</th>
                    <th>المشاهدة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="videoTableBody">
                <tr><td colspan="5" style="text-align: center;">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ضع رابط قاعدة البيانات الخاص بك هنا (تأكد من وجود / في نهاية الرابط)
    const DB_URL = "YOUR_FIREBASE_DB_URL/videos";

    // دالة لتوليد كود فريد مكون من 9 أحرف (VID)
    function generateVID() {
        return Math.random().toString(36).substring(2, 11);
    }

    // إضافة فيديو جديد
    document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value;
        const streamUrl = document.getElementById('streamUrl').value;
        const vid = generateVID();

        const data = { vid, title, streamUrl, createdAt: Date.now() };

        try {
            await fetch(`${DB_URL}/${vid}.json`, {
                method: 'PUT',
                body: JSON.stringify(data)
            });
            alert('تمت إضافة الفيديو بنجاح!');
            document.getElementById('addForm').reset();
            loadVideos();
        } catch (err) {
            alert('حدث خطأ أثناء الإضافة!');
        }
    });

    // جلب الفيديوهات
    async function loadVideos() {
        const tbody = document.getElementById('videoTableBody');
        try {
            const res = await fetch(`${DB_URL}.json`);
            const data = await res.json();
            tbody.innerHTML = '';

            if (!data) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">لا توجد فيديوهات مضافة بعد.</td></tr>';
                return;
            }

            Object.values(data).reverse().forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.title}</td>
                    <td><code>${item.vid}</code></td>
                    <td class="url-cell" title="${item.streamUrl}">${item.streamUrl}</td>
                    <td><a href="play.html?vid=${item.vid}" target="_blank">رابط المشغل ↗</a></td>
                    <td><button class="btn-danger" onclick="deleteVideo('${item.vid}')">حذف</button></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">حدث خطأ أثناء تحميل البيانات.</td></tr>';
        }
    }

    // حذف فيديو
    async function deleteVideo(vid) {
        if (confirm('هل أنت تأكد من الحذف؟')) {
            await fetch(`${DB_URL}/${vid}.json`, { method: 'DELETE' });
            loadVideos();
        }
    }

    loadVideos();
</script>

</body>
</html>
