<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفيديوهات - FARESPCB Video Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- HLS.js library for m3u8 streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .player-container { width: 100%; max-width: 900px; background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .info-panel { padding: 20px; }
        h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 15px; }
        .servers-title { font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px; font-weight: 600; }
        .servers-btns { display: flex; gap: 10px; flex-wrap: wrap; }
        .server-btn { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; font-weight: 600; }
        .server-btn:hover { background: #0284c7; border-color: #38bdf8; }
        .server-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .error-msg { text-align: center; padding: 30px; color: #ef4444; }
    </style>
</head>
<body>

<div class="player-container">
    <div id="content">
        <div class="loading">جاري تحميل المشغل والبيانات...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC9cmh_bzA4ZeV8bYlbqaGrmIri2PUGx2A",
        authDomain: "voip17.firebaseapp.com",
        databaseURL: "https://voip17-default-rtdb.firebaseio.com",
        projectId: "voip17",
        storageBucket: "voip17.firebasestorage.app",
        messagingSenderId: "608379006778",
        appId: "1:608379006778:web:51fe8032d09fbd5b556a03",
        measurementId: "G-GZNJZLM701"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // جلب VID من URL
    const urlParams = new URLSearchParams(window.location.search);
    const vid = urlParams.get('vid');

    let hls = null;

    async function initPlayer() {
        const container = document.getElementById('content');
        if (!vid) {
            container.innerHTML = '<div class="error-msg">معرف الفيديو غير صحيح أو مفقود!</div>';
            return;
        }

        try {
            const snapshot = await get(ref(db, 'videos/' + vid));
            if (!snapshot.exists()) {
                container.innerHTML = '<div class="error-msg">الفيديو غير موجود أو تم حذفه!</div>';
                return;
            }

            const videoData = snapshot.val();
            const servers = videoData.servers || [];

            if (servers.length === 0) {
                container.innerHTML = '<div class="error-msg">لا توجد سيرفرات متاح لهذا الفيديو حالياً!</div>';
                return;
            }

            // بناء واجهة المشغل
            container.innerHTML = `
                <div class="video-wrapper">
                    <video id="videoPlayer" controls poster="${videoData.poster || ''}"></video>
                </div>
                <div class="info-panel">
                    <h1>${videoData.title}</h1>
                    <div class="servers-title">اختر سيرفر المشاهدة:</div>
                    <div class="servers-btns" id="serversContainer"></div>
                </div>
            `;

            const serversContainer = document.getElementById('serversContainer');
            servers.forEach((srv, index) => {
                const btn = document.createElement('button');
                btn.className = `server-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = srv.name || `سيرفر ${index + 1}`;
                btn.onclick = () => {
                    document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playStream(srv.url);
                };
                serversContainer.appendChild(btn);
            });

            // تشغيل السيرفر الأول تلقائياً
            playStream(servers[0].url);

        } catch (err) {
            container.innerHTML = `<div class="error-msg">حدث خطأ في جلب البيانات: ${err.message}</div>`;
        }
    }

    function playStream(url) {
        const video = document.getElementById('videoPlayer');

        if (hls) {
            hls.destroy();
        }

        if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => {});
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // لدعم متصفح Safari على iOS / Mac
            video.src = url;
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(() => {});
            });
        } else {
            alert('المتصفح لا يدعم تشغيل هذا النوع من الفيديوهات (HLS/m3u8)');
        }
    }

    initPlayer();
</script>

</body>
</html>
