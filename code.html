<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aflame Admin Accounts</title>
    <style>
      :root {
        --bg: #0d1117;
        --card: #141a22;
        --card-2: #1b2330;
        --gold: #f4b942;
        --gold-2: #d99b1f;
        --text: #f7f7f7;
        --muted: #a7b1c0;
        --danger: #ef4444;
        --success: #22c55e;
        --line: rgba(244, 185, 66, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Tahoma, Arial, sans-serif;
        background: radial-gradient(circle at top, #1a2432, var(--bg) 40%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .container {
        width: min(1100px, 100%);
      }

      .auth-box,
      .panel {
        background: rgba(20, 26, 34, 0.92);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .auth-box {
        max-width: 460px;
        margin: 0 auto;
      }

      .auth-head {
        background: linear-gradient(135deg, rgba(244, 185, 66, 0.14), rgba(255,255,255,0.02));
        border-bottom: 1px solid var(--line);
        padding: 26px 24px 14px;
      }

      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(244, 185, 66, 0.14);
        border: 1px solid rgba(244, 185, 66, 0.25);
        color: var(--gold);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .08em;
      }

      h1 {
        margin: 14px 0 8px;
        font-size: clamp(2rem, 6vw, 2.4rem);
      }

      .muted {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        padding: 16px 18px 0;
      }

      .tab {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        padding: 12px 16px;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
      }

      .tab.active {
        background: var(--gold);
        color: #111827;
        border-color: var(--gold);
      }

      .forms {
        padding: 18px;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      input, select, button {
        font: inherit;
      }

      input, select {
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 13px 14px;
        outline: none;
      }

      input:focus, select:focus {
        border-color: rgba(244, 185, 66, 0.6);
        box-shadow: 0 0 0 3px rgba(244, 185, 66, 0.12);
      }

      .primary-btn {
        border: none;
        background: linear-gradient(135deg, var(--gold), var(--gold-2));
        color: #111827;
        font-weight: 800;
        border-radius: 12px;
        padding: 14px 18px;
        cursor: pointer;
        transition: transform .2s ease;
      }

      .primary-btn:hover {
        transform: translateY(-1px);
      }

      .secondary-btn {
        background: transparent;
        color: var(--gold);
        border: 1px solid rgba(244, 185, 66, 0.36);
        border-radius: 12px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 700;
      }

      .alert {
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 14px;
        border: 1px solid transparent;
      }

      .alert.error {
        background: rgba(239, 68, 68, 0.07);
        border-color: rgba(239, 68, 68, 0.28);
        color: #fecaca;
      }

      .alert.success {
        background: rgba(34, 197, 94, 0.08);
        border-color: rgba(34, 197, 94, 0.24);
        color: #bbf7d0;
      }

      .hidden {
        display: none !important;
      }

      .panel {
        display: none;
      }

      .panel.show {
        display: block;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 24px 26px;
        border-bottom: 1px solid var(--line);
      }

      .panel-header h2 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }

      .panel-body {
        padding: 24px 26px 30px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }

      .stat {
        background: var(--card-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }

      .stat small {
        display: block;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .stat strong {
        font-size: 1.5rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }

      th, td {
        text-align: right;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      th {
        color: var(--gold);
        font-size: 13px;
        background: rgba(244, 185, 66, 0.03);
      }

      .role-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .role-admin {
        background: rgba(244, 185, 66, 0.14);
        color: var(--gold);
        border: 1px solid rgba(244, 185, 66, 0.25);
      }

      .role-user {
        background: rgba(255,255,255,0.05);
        color: #d7dce6;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .empty-box {
        margin-top: 14px;
        padding: 18px;
        border: 1px dashed rgba(255,255,255,0.1);
        border-radius: 12px;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .panel-header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="auth-box" id="authBox">
        <div class="auth-head">
          <span class="badge">AFLAME ADMIN</span>
          <h1>تسجيل الدخول</h1>
          <p class="muted">لوحة حسابات المديرين والمستخدمين بشكل منفصل باستخدام localStorage.</p>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="login" type="button">دخول</button>
          <button class="tab" data-tab="register" type="button">إنشاء حساب</button>
        </div>

        <div class="forms">
          <div id="authAlert" class="alert hidden" role="alert"></div>

          <form id="loginForm" autocomplete="on">
            <label>
              البريد الإلكتروني
              <input type="email" id="loginEmail" placeholder="admin@aflame.com" required />
            </label>

            <label>
              كلمة المرور
              <input type="password" id="loginPassword" placeholder="••••••••" required />
            </label>

            <button type="submit" class="primary-btn">دخول</button>
          </form>

          <form id="registerForm" class="hidden" autocomplete="on">
            <label>
              الاسم الكامل
              <input type="text" id="registerName" placeholder="أحمد ��حمد" required />
            </label>

            <label>
              البريد الإلكتروني
              <input type="email" id="registerEmail" placeholder="example@email.com" required />
            </label>

            <label>
              كلمة المرور
              <input type="password" id="registerPassword" placeholder="••••••••" required />
            </label>

            <label>
              نوع الحساب
              <select id="registerRole">
                <option value="admin">مدير</option>
                <option value="user">مستخدم</option>
              </select>
            </label>

            <button type="submit" class="primary-btn">إنشاء الحساب</button>
          </form>
        </div>
      </section>

      <section class="panel" id="adminPanel">
        <div class="panel-header">
          <div>
            <div class="badge">لوحة الإدارة</div>
            <h2 id="welcomeTitle">مرحباً</h2>
          </div>
          <button type="button" class="secondary-btn" id="logoutBtn">تسجيل الخروج</button>
        </div>

        <div class="panel-body">
          <div class="stats">
            <div class="stat">
              <small>إجمالي الحسابات</small>
              <strong id="totalAccounts">0</strong>
            </div>
            <div class="stat">
              <small>المديرين</small>
              <strong id="totalAdmins">0</strong>
            </div>
            <div class="stat">
              <small>المستخدمين</small>
              <strong id="totalUsers">0</strong>
            </div>
          </div>

          <div id="userTableWrap"></div>
        </div>
      </section>
    </div>

    <script>
      const STORAGE_KEY = 'aflame_admin_accounts_v1';
      const SESSION_KEY = 'aflame_admin_session_v1';

      const seedAccounts = [
        { id: crypto.randomUUID(), name: 'مدير النظام', email: 'admin@aflame.com', password: 'admin123', role: 'admin', createdAt: new Date().toISOString() },
        { id: crypto.randomUUID(), name: 'مستخدم تجريبي', email: 'user@aflame.com', password: 'user123', role: 'user', createdAt: new Date().toISOString() }
      ];

      const authBox = document.getElementById('authBox');
      const adminPanel = document.getElementById('adminPanel');
      const authAlert = document.getElementById('authAlert');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabs = document.querySelectorAll('.tab');
      const logoutBtn = document.getElementById('logoutBtn');

      function showAlert(type, message) {
        authAlert.classList.remove('hidden', 'error', 'success');
        authAlert.classList.add(type);
        authAlert.textContent = message;
      }

      function getAccounts() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(seedAccounts));
          return [...seedAccounts];
        }

        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) && parsed.length ? parsed : [...seedAccounts];
        } catch {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(seedAccounts));
          return [...seedAccounts];
        }
      }

      function saveAccounts(accounts) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
      }

      function getSession() {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) return null;

        try {
          return JSON.parse(raw);
        } catch {
          sessionStorage.removeItem(SESSION_KEY);
          return null;
        }
      }

      function setSession(user) {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(user));
      }

      function clearSession() {
        sessionStorage.removeItem(SESSION_KEY);
      }

      function switchTab(tabName) {
        const active = tabName === 'register' ? 'register' : 'login';
        tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === active));
        loginForm.classList.toggle('hidden', active !== 'login');
        registerForm.classList.toggle('hidden', active !== 'register');
      }

      function renderUsersTable() {
        const accounts = getAccounts();
        const tableWrap = document.getElementById('userTableWrap');
        const totalAccounts = document.getElementById('totalAccounts');
        const totalAdmins = document.getElementById('totalAdmins');
        const totalUsers = document.getElementById('totalUsers');

        totalAccounts.textContent = String(accounts.length);
        totalAdmins.textContent = String(accounts.filter((user) => user.role === 'admin').length);
        totalUsers.textContent = String(accounts.filter((user) => user.role === 'user').length);

        if (!accounts.length) {
          tableWrap.innerHTML = '<div class="empty-box">لا توجد حسابات حالياً.</div>';
          return;
        }

        tableWrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>الاسم</th>
                <th>البريد الإلكتروني</th>
                <th>الدور</th>
                <th>تاريخ الإنشاء</th>
              </tr>
            </thead>
            <tbody>
              ${accounts.map((user) => `
                <tr>
                  <td>${user.name}</td>
                  <td>${user.email}</td>
                  <td>
                    <span class="role-pill ${user.role === 'admin' ? 'role-admin' : 'role-user'}">
                      ${user.role === 'admin' ? 'مدير' : 'مستخدم'}
                    </span>
                  </td>
                  <td>${new Date(user.createdAt).toLocaleString('ar-EG')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      function renderDashboard() {
        const session = getSession();
        if (!session) {
          authBox.classList.remove('hidden');
          adminPanel.classList.remove('show');
          return;
        }

        authBox.classList.add('hidden');
        adminPanel.classList.add('show');
        document.getElementById('welcomeTitle').textContent = `مرحباً ${session.name}`;
        renderUsersTable();
      }

      function loginUser(email, password) {
        const accounts = getAccounts();
        const user = accounts.find((item) => item.email.toLowerCase() === email.toLowerCase() && item.password === password);

        if (!user) {
          showAlert('error', 'البريد الإلكتروني أو كلمة المرور غير صحيحة.');
          return;
        }

        setSession({ name: user.name, email: user.email, role: user.role });
        renderDashboard();
      }

      function registerUser(name, email, password, role) {
        const accounts = getAccounts();

        if (accounts.some((user) => user.email.toLowerCase() === email.toLowerCase())) {
          showAlert('error', 'هذا البريد مسجل بالفعل.');
          return;
        }

        const newUser = {
          id: crypto.randomUUID(),
          name,
          email,
          password,
          role,
          createdAt: new Date().toISOString()
        };

        const updated = [...accounts, newUser];
        saveAccounts(updated);
        setSession({ name: newUser.name, email: newUser.email, role: newUser.role });
        showAlert('success', 'تم إنشاء الحساب بنجاح.');
        renderDashboard();
      }

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          switchTab(tab.dataset.tab);
          authAlert.classList.add('hidden');
        });
      });

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        loginUser(email, password);
      });

      registerForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = document.getElementById('registerName').value.trim();
        const email = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPassword').value.trim();
        const role = document.getElementById('registerRole').value;

        if (!name || !email || !password) {
          showAlert('error', 'يرجى ملء جميع الحقول.');
          return;
        }

        registerUser(name, email, password, role);
      });

      logoutBtn.addEventListener('click', () => {
        clearSession();
        authAlert.classList.add('hidden');
        renderDashboard();
      });

      if (getSession()) {
        renderDashboard();
      } else {
        renderDashboard();
      }
    </script>
  </body>
</html>
